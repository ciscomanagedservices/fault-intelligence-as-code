name: ad000002_bgp_neighbor_admin_shutdown_v2
description: 'Detects when a BGP neighbor session is placed into administrative shutdown

  on an IOS XR router. The fault is identified by the ROUTING-BGP-5-ADJCHANGE

  syslog message with a reason of "Admin. shutdown" on the local router where

  the neighbor shutdown command was applied. The signature extracts the neighbor

  IP address, VRF name, and neighbor AS number for use by the paired Repair

  Action Workflow.

  [Alert Definition: AD000002; Fault Signature: FS000002]'
search: 'index=syslog sourcetype=cisco:ios "ROUTING-BGP-5-ADJCHANGE"

  | regex _raw="%ROUTING-BGP-5-ADJCHANGE\\s*:\\s*neighbor\\s+(\\S+)\\s+Down\\s+-\\s+Admin\\.\\s+shutdown.*?\\(VRF:\\s*(\\S+)\\)\\s+\\(AS:\\s*(\\d+)\\)"

  | rex field=_raw "%ROUTING-BGP-5-ADJCHANGE\s*:\s*neighbor\s+(?<neighbor_ip>\S+)\s+Down\s+-\s+Admin\.\s+shutdown.*?\(VRF:\s*(?<vrf_name>\S+)\)\s+\(AS:\s*(?<neighbor_as>\d+)\)"

  | eval alert_def_id="AD000002"

  | table _time device_name device_ip alert_def_id neighbor_ip vrf_name neighbor_as _raw'
is_scheduled: '1'
cron_schedule: '*/5 * * * *'
realtime_schedule: '1'
schedule_priority: default
schedule_window: '0'
run_on_startup: '0'
max_concurrent: '1'
alert_type: number of events
alert_comparator: greater than
alert_threshold: '0'
alert.severity: '3'
alert.track: '1'
alert.digest_mode: '0'
alert.expires: 7d
alert.suppress: '1'
alert.suppress.period: 1h
alert.suppress.fields: host
alert.suppress.group_name: ''
dispatch.earliest_time: -5m
dispatch.latest_time: now
dispatch.ttl: 2p
dispatch.max_count: '500000'
dispatch.max_time: '0'
dispatch.lookups: '1'
dispatch.spawn_process: '1'
dispatch.auto_cancel: '0'
dispatch.auto_pause: '0'
disabled: '0'
actions: webhook
action.webhook: '1'
action.webhook.param.url: http://localhost:8080/fault-alert
