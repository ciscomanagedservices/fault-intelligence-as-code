<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Intelligence Artifact Explorer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════════════════════════════
   Intelligence Artifact Explorer — Industrial/Utilitarian Dark Theme
   ═══════════════════════════════════════════════════════════════════════════ */

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  /* Base palette */
  --bg-0: #080b10;
  --bg-1: #0d1117;
  --bg-2: #151b23;
  --bg-3: #1c2333;
  --bg-hover: #1e2636;
  --border: #2a3346;
  --border-light: #384259;

  /* Text */
  --text-0: #e6edf3;
  --text-1: #b1bac4;
  --text-2: #7d8590;
  --text-3: #545d68;

  /* Accent colors */
  --accent-green: #3fb950;
  --accent-green-dim: #1a3a2a;
  --accent-amber: #d29922;
  --accent-amber-dim: #3d2e00;
  --accent-red: #f85149;
  --accent-red-dim: #3d1418;
  --accent-blue: #58a6ff;
  --accent-blue-dim: #122d4f;
  --accent-cyan: #39d2c0;
  --accent-purple: #bc8cff;

  /* Type badges */
  --fs-color: #58a6ff;
  --fs-bg: #122d4f;
  --rg-color: #d29922;
  --rg-bg: #3d2e00;
  --raw-color: #bc8cff;
  --raw-bg: #2a1a4e;

  /* Fonts */
  --font-mono: 'IBM Plex Mono', 'Cascadia Code', 'Fira Code', monospace;
  --font-sans: 'Instrument Sans', 'Segoe UI', system-ui, sans-serif;

  /* Spacing */
  --gap: 12px;
  --radius: 2px;
}

html { font-size: 14px; }

body {
  font-family: var(--font-sans);
  background: var(--bg-0);
  color: var(--text-0);
  line-height: 1.5;
  min-height: 100vh;
  position: relative;
}

/* Noise overlay for depth */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
  pointer-events: none;
  z-index: 0;
}

/* ─── Header ─────────────────────────────────────────────────────────── */

.header {
  position: sticky;
  top: 0;
  z-index: 100;
  background: var(--bg-1);
  border-bottom: 1px solid var(--border);
  padding: 0 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 52px;
  backdrop-filter: blur(12px);
}

.header-title {
  font-family: var(--font-mono);
  font-size: 0.85rem;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--text-1);
  display: flex;
  align-items: center;
  gap: 10px;
}

.header-title .sigil {
  width: 8px; height: 8px;
  background: var(--accent-cyan);
  display: inline-block;
  clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
}

.stats-ribbon {
  display: flex;
  gap: 2px;
  font-family: var(--font-mono);
  font-size: 0.75rem;
}

.stats-ribbon .stat {
  padding: 4px 10px;
  background: var(--bg-2);
  border: 1px solid var(--border);
  color: var(--text-2);
}

.stats-ribbon .stat:first-child { border-radius: var(--radius) 0 0 var(--radius); }
.stats-ribbon .stat:last-child { border-radius: 0 var(--radius) var(--radius) 0; }

.stats-ribbon .stat-value {
  color: var(--text-0);
  font-weight: 600;
}

/* ─── Main layout ────────────────────────────────────────────────────── */

.main {
  position: relative;
  z-index: 1;
  max-width: 1200px;
  margin: 0 auto;
  padding: 24px;
}

/* ─── Search panel ───────────────────────────────────────────────────── */

.search-panel {
  background: var(--bg-1);
  border: 1px solid var(--border);
  padding: 16px 20px;
  margin-bottom: 20px;
}

.search-input-row {
  display: flex;
  gap: 8px;
  margin-bottom: 12px;
}

.search-input {
  flex: 1;
  background: var(--bg-0);
  border: 1px solid var(--border);
  color: var(--text-0);
  font-family: var(--font-mono);
  font-size: 0.85rem;
  padding: 10px 14px;
  outline: none;
  transition: border-color 0.15s;
}

.search-input:focus {
  border-color: var(--accent-cyan);
}

.search-input::placeholder {
  color: var(--text-3);
}

.search-mode-row {
  display: flex;
  align-items: center;
  gap: 20px;
  margin-bottom: 12px;
}

.search-mode-row label {
  font-family: var(--font-mono);
  font-size: 0.75rem;
  color: var(--text-2);
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 6px;
}

.search-mode-row input[type="radio"] {
  accent-color: var(--accent-cyan);
}

.filter-row {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

.filter-select {
  background: var(--bg-0);
  border: 1px solid var(--border);
  color: var(--text-1);
  font-family: var(--font-mono);
  font-size: 0.75rem;
  padding: 6px 10px;
  cursor: pointer;
  outline: none;
  min-width: 120px;
}

.filter-select:focus { border-color: var(--accent-cyan); }

.filter-select option { background: var(--bg-1); color: var(--text-0); }

.filter-tag {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  background: var(--bg-3);
  border: 1px solid var(--border);
  color: var(--text-1);
  font-family: var(--font-mono);
  font-size: 0.7rem;
  padding: 3px 8px;
  cursor: pointer;
  transition: all 0.12s;
}

.filter-tag.active {
  background: var(--accent-blue-dim);
  border-color: var(--accent-blue);
  color: var(--accent-blue);
}

.filter-tag:hover { border-color: var(--text-2); }

.search-status {
  font-family: var(--font-mono);
  font-size: 0.75rem;
  color: var(--text-3);
  margin-top: 10px;
  padding-top: 10px;
  border-top: 1px solid var(--border);
}

.search-status .highlight { color: var(--accent-cyan); }

/* ─── Results ────────────────────────────────────────────────────────── */

.results-area { margin-bottom: 24px; }

.group-card {
  background: var(--bg-1);
  border: 1px solid var(--border);
  margin-bottom: 8px;
  animation: slideIn 0.25s ease-out both;
}

@keyframes slideIn {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: translateY(0); }
}

.group-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 16px;
  border-bottom: 1px solid var(--border);
  cursor: pointer;
  transition: background 0.12s;
}

.group-header:hover { background: var(--bg-hover); }

.group-name {
  font-family: var(--font-mono);
  font-size: 0.8rem;
  font-weight: 600;
  color: var(--text-0);
}

.group-meta {
  display: flex;
  gap: 8px;
  align-items: center;
}

.group-count {
  font-family: var(--font-mono);
  font-size: 0.7rem;
  color: var(--text-2);
}

.match-badge {
  font-family: var(--font-mono);
  font-size: 0.65rem;
  font-weight: 600;
  padding: 2px 8px;
  background: var(--accent-green-dim);
  border: 1px solid var(--accent-green);
  color: var(--accent-green);
  text-transform: uppercase;
  letter-spacing: 0.06em;
}

.group-body { padding: 0; }

/* ─── Artifact row ───────────────────────────────────────────────────── */

.artifact-row {
  border-bottom: 1px solid var(--border);
  transition: background 0.1s;
}

.artifact-row:last-child { border-bottom: none; }

.artifact-summary {
  display: grid;
  grid-template-columns: 60px 1fr auto;
  align-items: center;
  gap: 12px;
  padding: 10px 16px;
  cursor: pointer;
  transition: background 0.1s;
}

.artifact-summary:hover { background: var(--bg-hover); }

.type-badge {
  font-family: var(--font-mono);
  font-size: 0.65rem;
  font-weight: 600;
  text-align: center;
  padding: 3px 0;
  letter-spacing: 0.05em;
  text-transform: uppercase;
}

.type-badge.fs { color: var(--fs-color); background: var(--fs-bg); border: 1px solid var(--fs-color); }
.type-badge.rg { color: var(--rg-color); background: var(--rg-bg); border: 1px solid var(--rg-color); }
.type-badge.raw { color: var(--raw-color); background: var(--raw-bg); border: 1px solid var(--raw-color); }

.artifact-info { min-width: 0; }

.artifact-name {
  font-family: var(--font-mono);
  font-size: 0.8rem;
  font-weight: 500;
  color: var(--text-0);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.artifact-meta-line {
  font-size: 0.75rem;
  color: var(--text-2);
  margin-top: 2px;
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
}

.artifact-meta-line .sep { color: var(--text-3); }

.artifact-id {
  font-family: var(--font-mono);
  font-size: 0.7rem;
  color: var(--text-2);
  white-space: nowrap;
}

/* ─── Artifact detail (expanded) ─────────────────────────────────────── */

.artifact-detail {
  display: none;
  padding: 12px 16px 16px 88px;
  border-top: 1px solid var(--border);
  background: var(--bg-2);
  animation: fadeIn 0.2s ease-out;
}

@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

.artifact-detail.open { display: block; }

.detail-section {
  margin-bottom: 12px;
}

.detail-section:last-child { margin-bottom: 0; }

.detail-label {
  font-family: var(--font-mono);
  font-size: 0.65rem;
  font-weight: 600;
  color: var(--text-3);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  margin-bottom: 4px;
}

.detail-text {
  font-size: 0.8rem;
  color: var(--text-1);
  line-height: 1.6;
  white-space: pre-wrap;
}

.detail-tags {
  display: flex;
  gap: 4px;
  flex-wrap: wrap;
}

.detail-tag {
  font-family: var(--font-mono);
  font-size: 0.65rem;
  padding: 2px 6px;
  background: var(--bg-3);
  border: 1px solid var(--border);
  color: var(--text-2);
}

.regex-block {
  position: relative;
  background: var(--bg-0);
  border: 1px solid var(--border);
  padding: 10px 12px;
  font-family: var(--font-mono);
  font-size: 0.75rem;
  color: var(--accent-cyan);
  line-height: 1.8;
  overflow-x: auto;
  white-space: pre-wrap;
  word-break: break-all;
}

.sample-block {
  position: relative;
  background: var(--bg-0);
  border: 1px solid var(--border);
  border-left: 2px solid var(--accent-amber);
  padding: 10px 12px;
  font-family: var(--font-mono);
  font-size: 0.72rem;
  color: var(--text-1);
  line-height: 1.8;
  overflow-x: auto;
  white-space: pre-wrap;
  word-break: break-all;
  margin-bottom: 4px;
}

.sample-block:last-child { margin-bottom: 0; }

.copy-btn {
  position: absolute;
  top: 6px;
  right: 6px;
  background: var(--bg-3);
  border: 1px solid var(--border);
  color: var(--text-2);
  font-family: var(--font-mono);
  font-size: 0.65rem;
  padding: 3px 8px;
  cursor: pointer;
  transition: all 0.12s;
}

.copy-btn:hover { border-color: var(--accent-cyan); color: var(--accent-cyan); }
.copy-btn.copied { border-color: var(--accent-green); color: var(--accent-green); }

.linked-list {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.linked-item {
  font-family: var(--font-mono);
  font-size: 0.75rem;
  color: var(--accent-blue);
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  transition: color 0.12s;
}

.linked-item:hover { color: var(--text-0); }
.linked-item .arrow { color: var(--text-3); }

.symptom-list {
  list-style: none;
  padding: 0;
}

.symptom-list li {
  font-size: 0.8rem;
  color: var(--text-1);
  padding: 3px 0 3px 16px;
  position: relative;
}

.symptom-list li::before {
  content: '›';
  position: absolute;
  left: 0;
  color: var(--accent-amber);
  font-weight: 600;
}

.dq-badge {
  font-family: var(--font-mono);
  font-size: 0.65rem;
  padding: 2px 8px;
  background: var(--accent-amber-dim);
  border: 1px solid var(--accent-amber);
  color: var(--accent-amber);
}

.file-path {
  font-family: var(--font-mono);
  font-size: 0.7rem;
  color: var(--text-3);
}

.gh-link {
  font-family: var(--font-mono);
  font-size: 0.7rem;
  color: var(--accent-blue);
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  transition: color 0.12s;
}

.gh-link:hover { color: var(--text-0); }

.gh-link .gh-icon {
  font-size: 0.75rem;
  opacity: 0.7;
}

/* ─── Coverage Matrix ────────────────────────────────────────────────── */

.coverage-section {
  background: var(--bg-1);
  border: 1px solid var(--border);
  margin-bottom: 20px;
}

.coverage-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 16px;
  cursor: pointer;
  transition: background 0.12s;
}

.coverage-header:hover { background: var(--bg-hover); }

.coverage-title {
  font-family: var(--font-mono);
  font-size: 0.8rem;
  font-weight: 600;
  color: var(--text-1);
  text-transform: uppercase;
  letter-spacing: 0.06em;
}

.coverage-toggle {
  font-family: var(--font-mono);
  font-size: 0.7rem;
  color: var(--text-3);
}

.coverage-body {
  display: none;
  padding: 0;
  overflow-x: auto;
}

.coverage-body.open { display: block; }

.coverage-table {
  width: 100%;
  border-collapse: collapse;
  font-family: var(--font-mono);
  font-size: 0.75rem;
}

.coverage-table th {
  background: var(--bg-2);
  color: var(--text-2);
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  font-size: 0.65rem;
  padding: 8px 12px;
  text-align: left;
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
}

.coverage-table td {
  padding: 6px 12px;
  border-bottom: 1px solid var(--border);
  color: var(--text-1);
}

.coverage-table tr:hover td { background: var(--bg-hover); }

.cov-zero {
  color: var(--text-3);
  background: var(--accent-amber-dim);
}

.cov-count { text-align: center; }

.cov-components {
  color: var(--text-2);
  font-size: 0.7rem;
}

/* ─── Empty state ────────────────────────────────────────────────────── */

.empty-state {
  text-align: center;
  padding: 60px 20px;
  color: var(--text-3);
}

.empty-state .empty-icon {
  font-size: 2.5rem;
  margin-bottom: 16px;
  opacity: 0.4;
}

.empty-state h3 {
  font-family: var(--font-mono);
  font-size: 0.9rem;
  color: var(--text-2);
  margin-bottom: 8px;
}

.empty-state p {
  font-size: 0.8rem;
  max-width: 400px;
  margin: 0 auto;
}

/* ─── Footer ─────────────────────────────────────────────────────────── */

.footer {
  text-align: center;
  padding: 24px;
  font-family: var(--font-mono);
  font-size: 0.65rem;
  color: var(--text-3);
  border-top: 1px solid var(--border);
}

/* ─── Scrollbar ──────────────────────────────────────────────────────── */

::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: var(--bg-0); }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: var(--border-light); }

/* ─── Responsive ─────────────────────────────────────────────────────── */

@media (max-width: 768px) {
  .header { padding: 0 12px; }
  .stats-ribbon { display: none; }
  .main { padding: 12px; }
  .artifact-summary { grid-template-columns: 48px 1fr auto; gap: 8px; padding: 8px 12px; }
  .artifact-detail { padding-left: 60px; }
  .filter-row { flex-direction: column; }
}
</style>
</head>
<body>

<!-- ═══ Header ═══════════════════════════════════════════════════════════ -->
<header class="header">
  <div class="header-title">
    <span class="sigil"></span>
    Intelligence Artifact Explorer
  </div>
  <div class="stats-ribbon" id="statsRibbon"></div>
</header>

<!-- ═══ Main ═════════════════════════════════════════════════════════════ -->
<main class="main">

  <!-- Search Panel -->
  <section class="search-panel">
    <div class="search-input-row">
      <input type="text" class="search-input" id="searchInput"
             placeholder="Paste a syslog message to match against signatures…"
             autocomplete="off" spellcheck="false">
    </div>
    <div class="search-mode-row">
      <label><input type="radio" name="mode" value="syslog" checked> Syslog regex match</label>
      <label><input type="radio" name="mode" value="keyword"> Keyword search</label>
      <label><input type="radio" name="mode" value="id"> Search by ID</label>
    </div>
    <div class="filter-row" id="filterRow"></div>
    <div class="search-status" id="searchStatus"></div>
  </section>

  <!-- Results -->
  <section class="results-area" id="resultsArea"></section>

  <!-- Coverage Matrix -->
  <section class="coverage-section" id="coverageSection">
    <div class="coverage-header" onclick="toggleCoverage()">
      <span class="coverage-title">Coverage Matrix</span>
      <span class="coverage-toggle" id="coverageToggle">▸ expand</span>
    </div>
    <div class="coverage-body" id="coverageBody"></div>
  </section>

</main>

<footer class="footer" id="footer"></footer>

<script>
(function() {
  'use strict';

  // ─── Load index data ───────────────────────────────────────────────
  let INDEX;
  try {
    const raw = document.getElementById('indexData').textContent;
    INDEX = JSON.parse(raw);
  } catch (e) {
    document.getElementById('resultsArea').innerHTML =
      '<div class="empty-state"><div class="empty-icon">⚠</div>' +
      '<h3>Index data not found</h3>' +
      '<p>Run ia-publish to generate index.json, then ia-explorer to rebuild this page.</p></div>';
    return;
  }

  const artifacts = INDEX.artifacts || [];
  const stats = INDEX.stats || {};
  const repoUrl = (INDEX.repo_url || '').replace(/\/$/, '');
  const defaultBranch = INDEX.default_branch || 'main';

  // ─── Python → JS regex translation ─────────────────────────────────
  function pythonToJsRegex(pattern) {
    // Convert Python named groups (?P<name>...) to JS (?<name>...)
    let js = pattern.replace(/\(\?P</g, '(?<');
    // Strip inline flags (?i) (?m) etc at start
    js = js.replace(/^\(\?[imsx]+\)/, '');
    return js;
  }

  // ─── Build type badge shortcode ────────────────────────────────────
  function typeShort(type) {
    const map = {
      fault_signature: 'FS',
      remediation_guide: 'RG',
      repair_action_workflow: 'RAW',
      collection_list: 'CL',
      parser: 'P',
      health_check_rule: 'HCR'
    };
    return map[type] || type;
  }

  function typeCssClass(type) {
    const map = {
      fault_signature: 'fs',
      remediation_guide: 'rg',
      repair_action_workflow: 'raw'
    };
    return map[type] || 'fs';
  }

  // ─── Stats ribbon ─────────────────────────────────────────────────
  function renderStats() {
    const ribbon = document.getElementById('statsRibbon');
    const parts = [];
    const bt = stats.by_type || {};
    if (bt.fault_signature) parts.push(`<span class="stat"><span class="stat-value">${bt.fault_signature}</span> FS</span>`);
    if (bt.remediation_guide) parts.push(`<span class="stat"><span class="stat-value">${bt.remediation_guide}</span> RG</span>`);
    if (bt.repair_action_workflow) parts.push(`<span class="stat"><span class="stat-value">${bt.repair_action_workflow}</span> RAW</span>`);
    parts.push(`<span class="stat"><span class="stat-value">${stats.groups || 0}</span> groups</span>`);
    parts.push(`<span class="stat"><span class="stat-value">${(stats.platforms || []).length}</span> platforms</span>`);
    ribbon.innerHTML = parts.join('');
  }

  // ─── Filters ──────────────────────────────────────────────────────
  let activeFilters = { platform: '', component: '', severity: '', types: new Set(['fault_signature', 'remediation_guide', 'repair_action_workflow']) };

  function buildFilters() {
    const row = document.getElementById('filterRow');
    let html = '';

    // Platform select
    const platforms = stats.platforms || [];
    html += '<select class="filter-select" id="filterPlatform" onchange="window._applyFilters()">';
    html += '<option value="">All Platforms</option>';
    platforms.forEach(p => { html += `<option value="${esc(p)}">${esc(p)}</option>`; });
    html += '</select>';

    // Component select
    const components = Object.keys(stats.by_component || {}).sort();
    html += '<select class="filter-select" id="filterComponent" onchange="window._applyFilters()">';
    html += '<option value="">All Components</option>';
    components.forEach(c => { html += `<option value="${esc(c)}">${esc(c)}</option>`; });
    html += '</select>';

    // Severity select
    const severities = Object.keys(stats.by_severity || {}).sort();
    html += '<select class="filter-select" id="filterSeverity" onchange="window._applyFilters()">';
    html += '<option value="">All Severities</option>';
    severities.forEach(s => { html += `<option value="${esc(s)}">${esc(s)}</option>`; });
    html += '</select>';

    // Type toggle tags
    html += '<span style="display:flex;gap:4px;margin-left:8px;">';
    [['fault_signature', 'FS'], ['remediation_guide', 'RG'], ['repair_action_workflow', 'RAW']].forEach(([t, label]) => {
      html += `<span class="filter-tag active" data-type="${t}" onclick="window._toggleType('${t}', this)">${label}</span>`;
    });
    html += '</span>';

    row.innerHTML = html;
  }

  window._applyFilters = function() {
    const p = document.getElementById('filterPlatform');
    const c = document.getElementById('filterComponent');
    const s = document.getElementById('filterSeverity');
    activeFilters.platform = p ? p.value : '';
    activeFilters.component = c ? c.value : '';
    activeFilters.severity = s ? s.value : '';
    runSearch();
  };

  window._toggleType = function(type, el) {
    if (activeFilters.types.has(type)) {
      activeFilters.types.delete(type);
      el.classList.remove('active');
    } else {
      activeFilters.types.add(type);
      el.classList.add('active');
    }
    runSearch();
  };

  // ─── Filter an artifact ───────────────────────────────────────────
  function passesFilters(a) {
    if (!activeFilters.types.has(a.type)) return false;
    if (activeFilters.severity && a.severity !== activeFilters.severity) return false;
    if (activeFilters.component && a.component !== activeFilters.component) return false;
    if (activeFilters.platform) {
      const pids = a.product_ids || [];
      if (!pids.some(p => p === activeFilters.platform)) return false;
    }
    return true;
  }

  // ─── Search engine ────────────────────────────────────────────────
  function syslogSearch(query) {
    const results = [];
    // Find FS artifacts whose regex patterns match the query
    artifacts.forEach(a => {
      if (a.type !== 'fault_signature') return;
      if (!passesFilters(a)) return;
      const patterns = a.regex_patterns || [];
      for (const p of patterns) {
        try {
          const jsPattern = pythonToJsRegex(p);
          const re = new RegExp(jsPattern, 'i');
          if (re.test(query)) {
            results.push({ artifact: a, matchedPattern: p, matchType: 'regex' });
            break;
          }
        } catch (e) { /* skip broken regex */ }
      }
    });
    return results;
  }

  function keywordSearch(query) {
    const q = query.toLowerCase();
    const results = [];
    artifacts.forEach(a => {
      if (!passesFilters(a)) return;
      const searchable = [
        a.name, a.description, a.component, a.severity,
        ...(a.tags || []),
        ...(a.syslog_mnemonics || []),
        ...(a.symptoms || []),
        a.group
      ].join(' ').toLowerCase();
      if (searchable.includes(q)) {
        results.push({ artifact: a, matchType: 'keyword' });
      }
    });
    return results;
  }

  function idSearch(query) {
    const q = query.trim().toLowerCase();
    const results = [];
    artifacts.forEach(a => {
      if (!passesFilters(a)) return;
      const id = String(a.id || '').toLowerCase();
      // Exact match or prefix match (case-insensitive)
      if (id === q || id.startsWith(q)) {
        results.push({ artifact: a, matchType: 'id' });
      }
    });
    return results;
  }

  // ─── Resolve linked artifacts for a match set ─────────────────────
  function resolveLinked(matchedArtifact) {
    const linked = matchedArtifact.linked_artifacts || {};
    const set = [matchedArtifact];
    const seen = new Set([matchedArtifact.name]);

    Object.values(linked).forEach(refName => {
      if (seen.has(refName)) return;
      const found = artifacts.find(a => a.name === refName);
      if (found) {
        set.push(found);
        seen.add(refName);
      }
    });

    // Sort: FS first, then RG, then RAW
    const order = { fault_signature: 0, remediation_guide: 1, repair_action_workflow: 2 };
    set.sort((a, b) => (order[a.type] ?? 9) - (order[b.type] ?? 9));
    return set;
  }

  // ─── Group results by group name ──────────────────────────────────
  function groupResults(searchResults, mode) {
    const groups = new Map();

    if (mode === 'syslog') {
      // For syslog matches, show matched FS + linked artifacts
      searchResults.forEach(r => {
        const matchSet = resolveLinked(r.artifact);
        const grp = r.artifact.group || 'ungrouped';
        if (!groups.has(grp)) groups.set(grp, { artifacts: [], isMatch: true });
        const existing = groups.get(grp);
        matchSet.forEach(a => {
          if (!existing.artifacts.find(x => x.name === a.name)) {
            existing.artifacts.push(a);
          }
        });
      });
    } else {
      // For keyword/id search, group all matching artifacts by group
      searchResults.forEach(r => {
        const grp = r.artifact.group || 'ungrouped';
        if (!groups.has(grp)) groups.set(grp, { artifacts: [], isMatch: false });
        const existing = groups.get(grp);
        if (!existing.artifacts.find(x => x.name === r.artifact.name)) {
          existing.artifacts.push(r.artifact);
        }
      });
    }

    return groups;
  }

  // ─── Render ───────────────────────────────────────────────────────
  function esc(str) {
    const d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }

  function renderArtifactRow(a, index) {
    const short = typeShort(a.type);
    const css = typeCssClass(a.type);
    const metaParts = [];
    if (a.severity) metaParts.push(esc(a.severity));
    if (a.component) metaParts.push(esc(a.component));
    if (a.product_ids && a.product_ids.length) metaParts.push(a.product_ids.slice(0, 4).map(esc).join(', ') + (a.product_ids.length > 4 ? '…' : ''));

    let detailHtml = '';

    // Description
    if (a.description) {
      detailHtml += `<div class="detail-section"><div class="detail-label">Description</div><div class="detail-text">${esc(a.description)}</div></div>`;
    }

    // Regex patterns (FS only)
    if (a.regex_patterns && a.regex_patterns.length) {
      const patternsText = a.regex_patterns.map(esc).join('\n');
      detailHtml += `<div class="detail-section"><div class="detail-label">Regex Patterns</div><div class="regex-block" id="regex-${index}"><button class="copy-btn" onclick="event.stopPropagation(); window._copyRegex(${index})">copy</button>${patternsText}</div></div>`;
    }

    // Message samples (FS only)
    if (a.message_samples && a.message_samples.length) {
      const samplesHtml = a.message_samples.map(s => `<div class="sample-block">${esc(s.trim())}</div>`).join('');
      detailHtml += `<div class="detail-section"><div class="detail-label">Message Samples</div>${samplesHtml}</div>`;
    }

    // Syslog mnemonics (FS only)
    if (a.syslog_mnemonics && a.syslog_mnemonics.length) {
      detailHtml += `<div class="detail-section"><div class="detail-label">Syslog Mnemonics</div><div class="detail-tags">${a.syslog_mnemonics.map(m => `<span class="detail-tag">${esc(m)}</span>`).join('')}</div></div>`;
    }

    // Symptoms (RG only)
    if (a.symptoms && a.symptoms.length) {
      detailHtml += `<div class="detail-section"><div class="detail-label">Symptoms</div><ul class="symptom-list">${a.symptoms.map(s => `<li>${esc(s)}</li>`).join('')}</ul></div>`;
    }

    // Tags
    if (a.tags && a.tags.length) {
      detailHtml += `<div class="detail-section"><div class="detail-label">Tags</div><div class="detail-tags">${a.tags.map(t => `<span class="detail-tag">${esc(t)}</span>`).join('')}</div></div>`;
    }

    // Platforms
    if (a.product_ids && a.product_ids.length) {
      detailHtml += `<div class="detail-section"><div class="detail-label">Platforms</div><div class="detail-tags">${a.product_ids.map(p => `<span class="detail-tag">${esc(p)}</span>`).join('')}</div></div>`;
    }

    // Linked artifacts
    const linked = a.linked_artifacts || {};
    const linkedKeys = Object.keys(linked);
    if (linkedKeys.length) {
      const linksHtml = linkedKeys.map(k => {
        const refName = linked[k];
        const label = k.replace(/_/g, ' ');
        return `<span class="linked-item" onclick="event.stopPropagation(); window._scrollToArtifact('${esc(refName)}')"><span class="arrow">→</span> ${esc(label)}: ${esc(refName)}</span>`;
      }).join('');
      detailHtml += `<div class="detail-section"><div class="detail-label">Linked Artifacts</div><div class="linked-list">${linksHtml}</div></div>`;
    }

    // Design questions
    if (a.design_questions > 0) {
      detailHtml += `<div class="detail-section"><span class="dq-badge">${a.design_questions} open design question${a.design_questions > 1 ? 's' : ''}</span></div>`;
    }

    // File path + GitHub link
    if (a.file) {
      let ghLinkHtml = '';
      if (repoUrl && a.file) {
        const ghUrl = `${repoUrl}/blob/${defaultBranch}/${a.file}`;
        ghLinkHtml = ` <a class="gh-link" href="${esc(ghUrl)}" target="_blank" rel="noopener noreferrer"><span class="gh-icon">↗</span> View on GitHub</a>`;
      }
      detailHtml += `<div class="detail-section"><div class="detail-label">File</div><span class="file-path">${esc(a.file)}</span>${ghLinkHtml}</div>`;
    }

    return `
      <div class="artifact-row" data-name="${esc(a.name)}" id="artifact-${esc(a.name)}">
        <div class="artifact-summary" onclick="window._toggleDetail(${index})">
          <div class="type-badge ${css}">${short}</div>
          <div class="artifact-info">
            <div class="artifact-name">${esc(a.name)}</div>
            <div class="artifact-meta-line">${metaParts.join('<span class="sep">·</span>')}</div>
          </div>
          <div class="artifact-id">${esc(String(a.id))} <span style="color:var(--text-3)">v${esc(a.version)}</span></div>
        </div>
        <div class="artifact-detail" id="detail-${index}">${detailHtml}</div>
      </div>`;
  }

  function renderGroups(groups) {
    const area = document.getElementById('resultsArea');
    if (groups.size === 0) {
      area.innerHTML = '<div class="empty-state"><div class="empty-icon">∅</div><h3>No matching artifacts</h3><p>Try a different search term or adjust filters.</p></div>';
      return;
    }

    let html = '';
    let artIdx = 0;
    let delay = 0;

    groups.forEach((data, groupName) => {
      const matchBadge = data.isMatch ? '<span class="match-badge">regex match</span>' : '';
      html += `<div class="group-card" style="animation-delay:${delay}ms">`;
      html += `<div class="group-header" onclick="this.parentElement.querySelector('.group-body').classList.toggle('collapsed')">`;
      html += `<span class="group-name">${esc(groupName)}</span>`;
      html += `<div class="group-meta">${matchBadge}<span class="group-count">${data.artifacts.length} artifact${data.artifacts.length > 1 ? 's' : ''}</span></div>`;
      html += `</div>`;
      html += `<div class="group-body">`;
      data.artifacts.forEach(a => {
        html += renderArtifactRow(a, artIdx++);
      });
      html += `</div></div>`;
      delay += 40;
    });

    area.innerHTML = html;
  }

  // ─── Coverage matrix ──────────────────────────────────────────────
  function buildCoverageMatrix() {
    // Build platform → { type → count, components: Set }
    const matrix = new Map();
    artifacts.forEach(a => {
      (a.product_ids || []).forEach(pid => {
        if (!matrix.has(pid)) matrix.set(pid, { fs: 0, rg: 0, raw: 0, components: new Set() });
        const row = matrix.get(pid);
        if (a.type === 'fault_signature') row.fs++;
        if (a.type === 'remediation_guide') row.rg++;
        if (a.type === 'repair_action_workflow') row.raw++;
        if (a.component) row.components.add(a.component);
      });
    });

    if (matrix.size === 0) {
      document.getElementById('coverageBody').innerHTML =
        '<div style="padding:16px;color:var(--text-3);font-family:var(--font-mono);font-size:0.75rem;">No platform data available.</div>';
      return;
    }

    let html = '<table class="coverage-table">';
    html += '<thead><tr><th>Platform</th><th class="cov-count">FS</th><th class="cov-count">RG</th><th class="cov-count">RAW</th><th>Components</th></tr></thead>';
    html += '<tbody>';

    // Sort by total count descending
    const sorted = [...matrix.entries()].sort((a, b) => {
      const totalA = a[1].fs + a[1].rg + a[1].raw;
      const totalB = b[1].fs + b[1].rg + b[1].raw;
      return totalB - totalA;
    });

    sorted.forEach(([pid, data]) => {
      const fsCls = data.fs === 0 ? ' class="cov-count cov-zero"' : ' class="cov-count"';
      const rgCls = data.rg === 0 ? ' class="cov-count cov-zero"' : ' class="cov-count"';
      const rawCls = data.raw === 0 ? ' class="cov-count cov-zero"' : ' class="cov-count"';
      html += `<tr>`;
      html += `<td>${esc(pid)}</td>`;
      html += `<td${fsCls}>${data.fs}</td>`;
      html += `<td${rgCls}>${data.rg}</td>`;
      html += `<td${rawCls}>${data.raw}</td>`;
      html += `<td class="cov-components">${[...data.components].sort().join(', ')}</td>`;
      html += `</tr>`;
    });

    html += '</tbody></table>';
    document.getElementById('coverageBody').innerHTML = html;
  }

  // ─── Placeholder text per mode ────────────────────────────────────
  const PLACEHOLDERS = {
    syslog: 'Paste a syslog message to match against signatures…',
    keyword: 'Search by keyword across name, description, tags, mnemonics…',
    id: 'Enter artifact ID or prefix (e.g. FS1000005, RAW6, 5000001)…'
  };

  function updatePlaceholder() {
    const mode = getMode();
    document.getElementById('searchInput').placeholder = PLACEHOLDERS[mode] || '';
  }

  // ─── Search orchestration ─────────────────────────────────────────
  function getMode() {
    const radios = document.querySelectorAll('input[name="mode"]');
    for (const r of radios) { if (r.checked) return r.value; }
    return 'syslog';
  }

  function runSearch() {
    const query = document.getElementById('searchInput').value.trim();
    const mode = getMode();
    const statusEl = document.getElementById('searchStatus');

    if (!query) {
      // Show all artifacts grouped, respecting filters
      const filtered = artifacts.filter(passesFilters);
      const groups = new Map();
      filtered.forEach(a => {
        const grp = a.group || 'ungrouped';
        if (!groups.has(grp)) groups.set(grp, { artifacts: [], isMatch: false });
        groups.get(grp).artifacts.push(a);
      });
      renderGroups(groups);
      statusEl.innerHTML = `Showing <span class="highlight">${filtered.length}</span> of ${artifacts.length} artifacts`;
      return;
    }

    let results;
    if (mode === 'syslog') {
      results = syslogSearch(query);
      const groups = groupResults(results, 'syslog');
      renderGroups(groups);
      const totalShown = [...groups.values()].reduce((s, g) => s + g.artifacts.length, 0);
      statusEl.innerHTML = `Syslog match: <span class="highlight">${results.length}</span> signature${results.length !== 1 ? 's' : ''} matched → ${totalShown} artifacts shown`;
    } else if (mode === 'id') {
      results = idSearch(query);
      const groups = groupResults(results, 'id');
      renderGroups(groups);
      statusEl.innerHTML = `ID search: <span class="highlight">${results.length}</span> artifact${results.length !== 1 ? 's' : ''} found`;
    } else {
      results = keywordSearch(query);
      const groups = groupResults(results, 'keyword');
      renderGroups(groups);
      statusEl.innerHTML = `Keyword search: <span class="highlight">${results.length}</span> artifact${results.length !== 1 ? 's' : ''} found`;
    }
  }

  // ─── Global interaction handlers ──────────────────────────────────
  window._toggleDetail = function(idx) {
    const el = document.getElementById('detail-' + idx);
    if (el) el.classList.toggle('open');
  };

  window._copyRegex = function(idx) {
    const el = document.getElementById('regex-' + idx);
    if (!el) return;
    const btn = el.querySelector('.copy-btn');
    // Get text content excluding the button text
    const text = el.textContent.replace('copy', '').replace('copied!', '').trim();
    navigator.clipboard.writeText(text).then(() => {
      btn.textContent = 'copied!';
      btn.classList.add('copied');
      setTimeout(() => { btn.textContent = 'copy'; btn.classList.remove('copied'); }, 1500);
    });
  };

  window._scrollToArtifact = function(name) {
    const el = document.getElementById('artifact-' + name);
    if (el) {
      el.scrollIntoView({ behavior: 'smooth', block: 'center' });
      el.style.outline = '1px solid var(--accent-cyan)';
      setTimeout(() => { el.style.outline = ''; }, 2000);
    }
  };

  window.toggleCoverage = function() {
    const body = document.getElementById('coverageBody');
    const toggle = document.getElementById('coverageToggle');
    body.classList.toggle('open');
    toggle.textContent = body.classList.contains('open') ? '▾ collapse' : '▸ expand';
  };

  // ─── Init ─────────────────────────────────────────────────────────
  renderStats();
  buildFilters();
  buildCoverageMatrix();
  runSearch(); // Initial render — show all

  // Live search on input
  let debounce;
  document.getElementById('searchInput').addEventListener('input', () => {
    clearTimeout(debounce);
    debounce = setTimeout(runSearch, 200);
  });

  // Mode change — update placeholder and re-run search
  document.querySelectorAll('input[name="mode"]').forEach(r => {
    r.addEventListener('change', () => {
      updatePlaceholder();
      runSearch();
    });
  });

  // Footer
  document.getElementById('footer').textContent =
    `Generated ${INDEX.generated || 'unknown'} · ${artifacts.length} artifacts indexed · Intelligence Artifact Explorer v2.0`;

})();
</script>

</body>
</html>
