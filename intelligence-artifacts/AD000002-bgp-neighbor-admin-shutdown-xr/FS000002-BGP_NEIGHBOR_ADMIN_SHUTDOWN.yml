# ──────────────────────────────────────────────────────────────────────────────
# OPEN DESIGN QUESTIONS
#
# 1. Regex anchoring: The pattern anchors on "Admin. shutdown" in the reason
#    field. Confirm this string is stable across all IOS XR 7.x+ releases and
#    all target platforms (ASR 9000, Cisco 8000, NCS 5500/5700, NCS 540).
#
# 2. VRF scope: The current signature fires for any VRF. If the intent is to
#    monitor only the default VRF (or a specific set of VRFs), add a VRF filter
#    to the regex and a corresponding extraction parameter.
#
# 3. IPv6 neighbors: The regex uses a simplified IP capture group that covers
#    both IPv4 and IPv6 addresses. Validate against real IPv6 syslog samples
#    from each target platform.
#
# 4. logic_lookback_time: Set to 0 (single event, no correlation window needed).
#    Confirm this is correct — no secondary event is required.
# ──────────────────────────────────────────────────────────────────────────────

schema_version: "0.0.1"

metadata:
  name: BGP_NEIGHBOR_ADMIN_SHUTDOWN
  id: "FS000002"
  alert_def_id: "AD000002"
  version: "1.0.0"
  description: |
    Detects when a BGP neighbor session is placed into administrative shutdown
    on an IOS XR router. The fault is identified by the ROUTING-BGP-5-ADJCHANGE
    syslog message with a reason of "Admin. shutdown" on the local router where
    the neighbor shutdown command was applied. The signature extracts the neighbor
    IP address, VRF name, and neighbor AS number for use by the paired Repair
    Action Workflow.
  severity: WARNING
  component: CONTROLLER
  product_ids:
    - "ASR 9000.*"
    - "Cisco 8000.*"
    - "NCS 5[57]00.*"
    - "NCS 540.*"
  os_versions:
    - "IOS.XR 7\\..*"
    - "IOS.XR [89]\\..*"
  tags:
    - bgp
    - routing
    - admin-shutdown
    - cisco-live-us-2026
    - devnet-3171
  created_date: "2026-05-25"
  modified_date: "2026-05-25"
  author: "CX Intelligence Team"
  priority: 5
  symptom: "LINK_DOWN"
  repair_action_workflow_ref: BGP_NEIGHBOR_ADMIN_SHUTDOWN_REPAIR

conditions:
  logic: "E1"
  logic_lookback_time: 0
  events:
    - event:
        id: "E1"
        type: syslog
        path: "syslog"
        message_type: "ROUTING-BGP-5-ADJCHANGE"
        message_sample: "May 25 22:21:25 192.0.2.43 610: RP/0/RP0/CPU0:May 25 22:20:44.445 UTC: bgp[1090]: %ROUTING-BGP-5-ADJCHANGE : neighbor 172.20.20.18 Down - Admin. shutdown (CEASE notification sent - administrative shutdown) (VRF: default) (AS: 3334)"
        evaluation:
          type: regex
          value: "%ROUTING-BGP-5-ADJCHANGE\\s*:\\s*neighbor\\s+(\\S+)\\s+Down\\s+-\\s+Admin\\.\\s+shutdown.*?\\(VRF:\\s*(\\S+)\\)\\s+\\(AS:\\s*(\\d+)\\)"
          parameters:
            - type: extract_to_variable
              name: neighbor_ip
              source: "match.group(1)"
              description: "IP address of the BGP neighbor that was administratively shut down"
            - type: extract_to_variable
              name: vrf_name
              source: "match.group(2)"
              description: "VRF in which the BGP neighbor session exists"
            - type: extract_to_variable
              name: neighbor_as
              source: "match.group(3)"
              description: "AS number of the BGP neighbor"
        match_count: 1
        match_period: 0
        clear_event:
          pattern: "%ROUTING-BGP-5-ADJCHANGE\\s*:\\s*neighbor\\s+{{ neighbor_ip }}\\s+Up"
          lookback_period: 300
          correlation_variables:
            - neighbor_ip
