# Test bundle for RAW000003 BGP Neighbor Max Prefix Limit Exceeded Repair.
#
# Diagnoses and repairs an IOS XR BGP neighbor session that was torn down by the
# remote peer after the local router exceeded the peer's inbound maximum-prefix
# limit. Uses the triggering Fault Signature syslog as authoritative max-prefix
# evidence, checks whether the neighbor still requires remediation, identifies
# the neighbor's outbound route policy, verifies the latest commit is relevant,
# rolls back the most recent commit, clears the BGP session, and verifies
# recovery.
#
# Terminal leaves covered here:
#   1. 1b                           → resolution  (session already recovered)
#   2. 1c                           → escalation  (session state cannot be determined)
#   3. 1a→2b                        → escalation  (outbound route policy not visible)
#   4. 1a→2a→3b                     → escalation  (latest commit is not a clear rollback candidate)
#   5. 1a→2a→3a→4a→5a               → resolution  (default VRF rollback + clear succeeds)
#   6. 1a→2a→3a→4b→5a               → resolution  (non-default VRF rollback + clear succeeds)
#   7. deny-approval at Step 3      → escalation  (agent-only rollback denial path)
#
#   8. 1a→2a→3a→4a→5b→6a            → escalation  (same max-prefix CEASE recurs in default VRF)
#   9. 1a→2a→3a→4a→5b→6b            → escalation  (different post-rollback issue in default VRF)
#  10. 1a→2a→3a→4b→5b→6a            → escalation  (same max-prefix CEASE recurs in non-default VRF)
#  11. 1a→2a→3a→4b→5b→6b            → escalation  (different post-rollback issue in non-default VRF)
#
# ─── How to run ──────────────────────────────────────────────────────────────
#
# Headless Python runner (no LLM, no Webex, no RADKit — CI-safe):
#
#   # Run all tests in this bundle
#   python scripts/run_raw_tests.py --bundle intelligence-artifacts/AD000003-bgp-max-prefix-adjchange-xr/tests/RAW000003-BGP_NEIGHBOR_MAX_PREFIX_LIMIT_EXCEEDED_REPAIR.tests.yml
#
#   # Run a single test by name
#   python scripts/run_raw_tests.py --bundle intelligence-artifacts/AD000003-bgp-max-prefix-adjchange-xr/tests/RAW000003-BGP_NEIGHBOR_MAX_PREFIX_LIMIT_EXCEEDED_REPAIR.tests.yml --test resolve_default_vrf_recovery
#
#   # Run with JUnit XML + Markdown summary output
#   python scripts/run_raw_tests.py --bundle intelligence-artifacts/AD000003-bgp-max-prefix-adjchange-xr/tests/RAW000003-BGP_NEIGHBOR_MAX_PREFIX_LIMIT_EXCEEDED_REPAIR.tests.yml --junit out/results.xml --summary out/summary.md
#
# Agent runner (network-troubleshooter in test mode — exercises Webex + approvals):
#
#   Paste this prompt into an OpenCode session with the network-troubleshooter agent:
#
#   Run the RAW test bundle for AD000003 / RAW000003 in test mode.
#
#   {
#     "alert_def_id": "AD000003",
#     "device_hostname": "xr-edge-01",
#     "mode": "strict",
#     "test_bundle_path": "intelligence-artifacts/AD000003-bgp-max-prefix-adjchange-xr/tests/RAW000003-BGP_NEIGHBOR_MAX_PREFIX_LIMIT_EXCEEDED_REPAIR.tests.yml",
#     "test_name": "resolve_default_vrf_recovery"
#   }
#
#   Omit "test_name" to run all tests sequentially.
#   Add "webex_notify": false to suppress Webex notifications.
#
# ─────────────────────────────────────────────────────────────────────────────

schema_version: "1.0.0"
raw_id: "RAW000003"
raw_path: "../RAW000003-BGP_NEIGHBOR_MAX_PREFIX_LIMIT_EXCEEDED_REPAIR.yml"
fs_path: "../FS000003-BGP_NEIGHBOR_MAX_PREFIX_LIMIT_EXCEEDED.yml"

default_approvals:
  default: "APPROVED"

tests:
  - name: resolve_session_already_recovered
    source: synthetic
    description: |
      The triggering syslog confirmed max-prefix, but by workflow execution time
      the neighbor is already Established. The RAW should resolve without any
      rollback or clear action.
    expected:
      outcome: "resolution"
      step_path: ["1"]
      action_ids: ["1b"]
      variables:
        bgp_state: "Established"
        session_state_found: true
    alert_payload:
      mode: strict
      alert_def_id: "AD000003"
      device_hostname: "xr-edge-01"
      alert_vars:
        neighbor_ip: "192.0.2.17"
        vrf_name: "default"
        neighbor_as: "64513"
    # Generated by raw-test-author 2026-05-29
    responses:
      - step_id: "1"
        command: "show bgp neighbors 192.0.2.17 | include \"BGP state\""
        output: "BGP state = Established, up for 00:03:12"
    approvals:
      default: "APPROVED"

  - name: escalate_session_state_not_determined
    source: synthetic
    description: |
      The triggering syslog confirmed max-prefix, but the current neighbor state
      cannot be parsed. The RAW should escalate rather than guess whether
      rollback is needed.
    expected:
      outcome: "escalation"
      step_path: ["1"]
      action_ids: ["1c"]
      variables:
        session_state_found: false
    alert_payload:
      mode: strict
      alert_def_id: "AD000003"
      device_hostname: "xr-edge-01"
      alert_vars:
        neighbor_ip: "192.0.2.17"
        vrf_name: "default"
        neighbor_as: "64513"
    # Updated for RAW v1.1.0
    responses:
      - step_id: "1"
        command: "show bgp neighbors 192.0.2.17 | include \"BGP state\""
        output: "No matching BGP neighbor state found"
    approvals:
      default: "APPROVED"

  - name: escalate_policy_not_visible
    source: synthetic
    description: |
      The triggering syslog confirmed max-prefix and the neighbor is still down,
      but the neighbor output does not show an attached outbound route policy.
      Without policy attribution, the workflow must escalate rather than guess at
      a rollback target.
    expected:
      outcome: "escalation"
      step_path: ["1", "2"]
      action_ids: ["1a", "2b"]
      variables:
        session_down: true
        bgp_state: "Idle"
        session_state_found: true
        policy_found: false
    alert_payload:
      mode: strict
      alert_def_id: "AD000003"
      device_hostname: "xr-edge-01"
      alert_vars:
        neighbor_ip: "192.0.2.17"
        vrf_name: "default"
        neighbor_as: "64513"
    # Generated by raw-test-author 2026-05-29
    responses:
      - step_id: "1"
        command: "show bgp neighbors 192.0.2.17 | include \"BGP state\""
        output: "BGP state = Idle"
      - step_id: "2"
        command: "show bgp neighbors 192.0.2.17 | include \"Policy for outgoing advertisements\""
        output: "No matching outgoing policy line found"
    approvals:
      default: "APPROVED"

  - name: escalate_latest_commit_not_candidate
    source: synthetic
    description: |
      The workflow confirms the neighbor still requires remediation and identifies the attached policy, but
      the most recent commit does not reference that policy or a related
      prefix-set. The RAW must escalate instead of rolling back an unrelated
      change.
    expected:
      outcome: "escalation"
      step_path: ["1", "2", "3"]
      action_ids: ["1a", "2a", "3b"]
      variables:
        session_down: true
        bgp_state: "Idle"
        session_state_found: true
        policy_name: "PEER_64513_EXPORT"
        policy_found: true
        latest_commit_relevant: false
    alert_payload:
      mode: strict
      alert_def_id: "AD000003"
      device_hostname: "xr-edge-01"
      alert_vars:
        neighbor_ip: "192.0.2.17"
        vrf_name: "default"
        neighbor_as: "64513"
    # Generated by raw-test-author 2026-05-29
    responses:
      - step_id: "1"
        command: "show bgp neighbors 192.0.2.17 | include \"BGP state\""
        output: "BGP state = Idle"
      - step_id: "2"
        command: "show bgp neighbors 192.0.2.17 | include \"Policy for outgoing advertisements\""
        output: "Policy for outgoing advertisements is PEER_64513_EXPORT"
      - step_id: "3"
        command: "show configuration commit changes last 1"
        output: |
          Building configuration...
          !! IOS XR Configuration 7.9.2
          interface HundredGigE0/0/0/1
           description CORE_UPLINK_REFRESH
          !
          end
    approvals:
      default: "APPROVED"

  - name: resolve_default_vrf_recovery
