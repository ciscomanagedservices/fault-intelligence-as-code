      is approved, the default-VRF clear command is used, and the session returns
      to Established state.
    expected:
      outcome: "resolution"
      step_path: ["1", "2", "3", "4", "5"]
      action_ids: ["1a", "2a", "3a", "4a", "5a"]
      variables:
        session_down: true
        bgp_state: "Idle"
        session_state_found: true
        policy_name: "PEER_64513_EXPORT"
        latest_commit_relevant: true
        session_established: true
        vrf_name: "default"
    alert_payload:
      mode: strict
      alert_def_id: "AD000003"
      device_hostname: "xr-edge-01"
      alert_vars:
        neighbor_ip: "192.0.2.17"
        vrf_name: "default"
        neighbor_as: "64513"
    # Generated by raw-test-author 2026-05-29
    responses:
      - step_id: "1"
        command: "show bgp neighbors 192.0.2.17 | include \"BGP state\""
        output: "BGP state = Idle"
      - step_id: "2"
        command: "show bgp neighbors 192.0.2.17 | include \"Policy for outgoing advertisements\""
        output: "Policy for outgoing advertisements is PEER_64513_EXPORT"
      - step_id: "3"
        command: "show configuration commit changes last 1"
        output: |
          Building configuration...
          !! IOS XR Configuration 7.9.2
          route-policy PEER_64513_EXPORT
            if destination in ANY_PREFIX then
              pass
            else
              drop
            endif
          end-policy
          !
          end
      - step_id: "3"
        command: "rollback configuration last 1"
        output: |
          Loading Rollback Changes.
          Loaded Rollback Changes in 1 sec
          Committing.
          1 items committed in 1 sec
          Updating.
          Updated Commit database in 1 sec
          Configuration successfully rolled back 1 commits.
      - step_id: "4"
        command: "clear bgp 192.0.2.17"
        output: ""
      - step_id: "5"
        command: "show bgp neighbors 192.0.2.17 | include \"BGP state\""
        output: "BGP state = Established, up for 00:00:47"
    approvals:
      default: "APPROVED"

