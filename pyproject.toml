[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "devnet-3171"
version = "0.1.0"
description = "Fault Intelligence as Code — AI Agents, RAG, and MCP for Network Ops (Cisco Live US 2026)"
requires-python = ">=3.12"
dependencies = [
    # Data validation
    "pydantic>=2.7",
    # YAML parsing
    "pyyaml>=6.0",
    # HTTP (async) + webhook relay
    "httpx>=0.27",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    # CLI output (scripts/simulate_alert.py)
    "requests>=2.31",
    # Webex websocket bot (outbound persistent connection — no inbound port needed)
    "webex-bot>=1.2.8",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4",
    "mypy>=1.10",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "types-pyyaml>=6.0",
    "types-requests>=2.31",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = []

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.12"
strict = true
pretty = true
show_error_codes = true
warn_unused_ignores = true
warn_return_any = true
disallow_any_generics = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--tb=short"

[tool.coverage.run]
source = ["app"]
omit = ["tests/*"]
